<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="toDo">
            <h1>🌸 My To Do List 🌸 <img src="images/icon.png" alt="icon"></h1>
            
            <div class="row">
                <input type="text" id="inputTask" placeholder="What's next?">
                <button id="tombol">tambah</button>
            </div>

            <ul id="listContainer"></ul>

            <!-- Rekap statistik tugas -->
            <div class="stats">
                <p>Total Tugas: <span id="totalCount">0</span></p>
                <p>Selesai: <span id="doneCount">0</span></p>
                <p>Belum Selesai: <span id="pendingCount">0</span></p>
            </div>
            </div>
    </div>

    <!-- Sambungkan app.js di sini -->
    <script src="app.js"></script>
</body>

</html>
